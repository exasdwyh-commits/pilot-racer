name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install Blender for generated runtime GLBs
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Rebuild Hyper3D runtime roster
        run: blender --background --python scripts/build_hyper3d_runtime_roster.py
      - run: npm run check
