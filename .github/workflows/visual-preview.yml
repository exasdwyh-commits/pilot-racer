name: Visual Preview

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - "server.mjs"
      - "assets/**"
      - "scripts/capture-preview.mjs"
      - ".github/workflows/visual-preview.yml"
  pull_request:
    paths:
      - "public/**"
      - "server.mjs"
      - "assets/**"
      - "scripts/capture-preview.mjs"
      - ".github/workflows/visual-preview.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm ci

      - name: Install screenshot runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Pilot Racer
        env:
          HOST: 127.0.0.1
          PORT: 9010
          RACE_SECONDS: 45
        run: |
          npm start > /tmp/pilot-preview.log 2>&1 &
          echo $! > /tmp/pilot-preview.pid

      - name: Wait for Pilot Racer
        run: |
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:9010/info >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pilot-preview.log
          exit 1

      - name: Capture real race screenshots
        run: node scripts/capture-preview.mjs

      - name: Upload visual preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilot-racer-visual-preview
          path: docs/screenshots/*.png
          if-no-files-found: error

      - name: Commit refreshed screenshots
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/tv-auto-director.png docs/screenshots/tv-free-director.png docs/screenshots/tv-helicopter.png docs/screenshots/phone-race.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "docs: refresh Pilot Racer visual screenshots"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
